[project]
name = "aoa"
version = "0.1.0"
description = "Always-on agent prototype: durable Temporal workflows, file memory, sandbox sleep/wake, cache-aware context"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",  # output_config / adaptive thinking
    "temporalio",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyjwt[crypto]"]
github-app = ["pyjwt[crypto]"]
slack = ["slack_sdk", "aiohttp"]

[tool.setuptools]
packages = ["aoa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["temporal: needs a reachable Temporal dev server (set AOA_TEMPORAL_ADDRESS or run `temporal server start-dev`)"]
